<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#f4f7fb"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173a70">One profile. Two very different job matches.</text><text x="60" y="103" font-family="Arial,sans-serif" font-size="17" fill="#5e7185">The score helps prioritise adverts and spot gaps — it is not a hiring probability.</text><rect x="60" y="140" width="520" height="400" rx="18" fill="#fff" stroke="#dce5ee"/><rect x="60" y="140" width="520" height="76" rx="18" fill="#e1f5ed"/><rect x="60" y="193" width="520" height="23" fill="#e1f5ed"/><text x="88" y="173" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#12634d">EXAMPLE A · RELEVANT ROLE</text><text x="88" y="198" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173a70">Junior AWS Cloud Support Engineer</text><text x="88" y="270" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#168268">86.34%</text><text x="88" y="299" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168268">EXCELLENT MATCH</text><rect x="88" y="321" width="430" height="12" rx="6" fill="#e7edf2"/><rect x="88" y="321" width="371" height="12" rx="6" fill="#20a486"/><text x="88" y="370" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#30465c">Why it scores well</text><text x="88" y="400" font-family="Arial,sans-serif" font-size="15" fill="#52677b">✓ AWS, Linux and networking overlap</text><text x="88" y="428" font-family="Arial,sans-serif" font-size="15" fill="#52677b">✓ Troubleshooting and Windows recognised</text><text x="88" y="456" font-family="Arial,sans-serif" font-size="15" fill="#92600c">! CloudWatch identified as a skill gap</text><text x="88" y="505" font-family="Arial,sans-serif" font-size="14" fill="#718397">Prototype test example</text><rect x="620" y="140" width="520" height="400" rx="18" fill="#fff" stroke="#dce5ee"/><rect x="620" y="140" width="520" height="76" rx="18" fill="#fff0e9"/><rect x="620" y="193" width="520" height="23" fill="#fff0e9"/><text x="648" y="173" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a54427">EXAMPLE B · UNRELATED ROLE</text><text x="648" y="198" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173a70">Retail Store Manager</text><text x="648" y="270" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#c05b3e">29.31%</text><text x="648" y="299" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#a54427">POOR MATCH</text><rect x="648" y="321" width="430" height="12" rx="6" fill="#e7edf2"/><rect x="648" y="321" width="126" height="12" rx="6" fill="#d46c50"/><text x="648" y="370" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#30465c">Why it scores lower</text><text x="648" y="400" font-family="Arial,sans-serif" font-size="15" fill="#52677b">• Few recognised skills overlap</text><text x="648" y="428" font-family="Arial,sans-serif" font-size="15" fill="#52677b">• Retail-specific requirements are missing</text><text x="648" y="456" font-family="Arial,sans-serif" font-size="15" fill="#52677b">• Suggests focusing on closer-fit roles</text><text x="648" y="505" font-family="Arial,sans-serif" font-size="14" fill="#718397">Prototype test example</text><text x="600" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#718397">Scores are outputs from this project's current prototype; results can change as the dataset and model improve.</text></svg>