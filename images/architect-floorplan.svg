<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Architectural floor plan study</title><desc id="desc">A crisp top-down floor plan of a modern single-storey home with labelled rooms, furniture, doors and windows.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#cbd5e1" stroke-opacity=".22" stroke-width="1"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".28"/></filter></defs>
<rect width="1200" height="675" fill="#111827"/><rect width="1200" height="675" fill="url(#grid)"/>
<text x="54" y="58" font-family="Arial,sans-serif" font-size="17" letter-spacing="4" fill="#67e8f9">HERMES + BLENDER / DESIGN STUDY</text><text x="54" y="98" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#f8fafc">ARCHITECT FLOORPLAN</text><text x="54" y="125" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">2D RESIDENTIAL LAYOUT · CONCEPTUAL PLAN</text>
